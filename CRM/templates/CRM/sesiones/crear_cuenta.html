<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form>
        <h1>Crear Cuenta</h1>

        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre completo">

        <label for="rut">Rut</label>
        <input type="text" id="rut" placeholder="Ingrese su rut">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña">

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="Ingrese su correo">

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ingrese su teléfono">

        <button type="submit">Crear cuenta</button>
    </form>

</body>
</html>
