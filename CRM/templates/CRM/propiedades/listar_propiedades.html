{% extends 'CRM/base.html' %}

{% block title %}Listado de Propiedades{% endblock %}

    <h2>Propiedades Disponibles</h2>
    <a href="#" class="btn btn-primary">+ Registrar Propiedad</a>
</div>

<div class="row">
    <div class="col-md-4 mb-3">

                <h5 class="card-title">Casa en Sector Norte</h5>

            <div class="card-footer bg-white border-top-0">
                <a href="#" class="btn btn-outline-primary btn-sm w-100">Ver Detalles</a>

        </div>
    </div>
